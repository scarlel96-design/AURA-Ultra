// Inventory only. Do not change dependency resolution or trust settings.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.result.UnresolvedDependencyResult
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.register("auraAuditDependencyGraph") {
        doLast {
            def rows = []
            root.allprojects.sort { it.path }.each { p ->
                def groups = [project: p.configurations, buildscript: p.buildscript.configurations]
                groups.each { scope, configs ->
                    configs.findAll { it.canBeResolved }.sort { it.name }.each { config ->
                        def row = [project: p.path, scope: scope, configuration: config.name,
                                   modules: [], unresolved: [], error: null]
                        try {
                            def graph = config.incoming.resolutionResult
                            row.modules = graph.allComponents.collect { it.id }
                                .findAll { it instanceof ModuleComponentIdentifier }
                                .collect { it.group + ":" + it.module + ":" + it.version }
                                .unique().sort()
                            row.unresolved = graph.allDependencies
                                .findAll { it instanceof UnresolvedDependencyResult }
                                .collect { it.attempted.displayName }.unique().sort()
                        } catch (Exception e) {
                            row.error = e.class.name + ": " + (e.message ?: "")
                        }
                        rows.add(row)
                    }
                }
            }
            def target = new File(System.getenv("AURA_INVENTORY_GRAPH"))
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson(rows)) + "\n"
            println("AURA_INVENTORY_GRAPH " + rows.size())
        }
    }
}
