name: Domain Kotlin
on:
  push:
    paths:
      - 'modules/domain/**'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'tools/check_domain_results.py'
      - 'tests/unit/test_domain_results.py'
      - 'tests/unit/test_f01_r02.py'
      - '.github/workflows/domain-kotlin.yml'
  pull_request:
    paths:
      - 'modules/domain/**'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'tools/check_domain_results.py'
      - 'tests/unit/test_domain_results.py'
      - 'tests/unit/test_f01_r02.py'
      - '.github/workflows/domain-kotlin.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: domain-kotlin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Confirm checkout credentials are not persisted
        shell: bash
        run: |
          rc=0
          git config --local --name-only --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1 || rc=$?
          test "$rc" -eq 1
      - name: Verify Gradle wrapper
        run: echo "b3a875ddc1f044746e1b1a55f645584505f4a10438c1afea9f15e92a7c42ec13  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Clean Kotlin domain tests
        run: ./gradlew -p modules/domain clean test --rerun-tasks --no-build-cache --no-daemon
      - name: Verify evidence checker
        run: python -m unittest discover -s tests/unit -p test_domain_results.py -v
      - name: Validate JUnit evidence
        env:
          DOMAIN_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: python tools/check_domain_results.py modules/domain/build/test-results/test --ci
      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: domain-junit-xml
          path: modules/domain/build/test-results/test/*.xml
          if-no-files-found: error
