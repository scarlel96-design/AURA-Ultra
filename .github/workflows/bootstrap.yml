name: AURA Bootstrap
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aura-bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Confirm checkout credentials are not persisted
        shell: bash
        run: |
          rc=0
          git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1 || rc=$?
          test "$rc" -eq 1
      - name: Check active documentation budget
        run: python tools/check_doc_budget.py
      - name: Verify Gradle wrapper
        run: echo 'b3a875ddc1f044746e1b1a55f645584505f4a10438c1afea9f15e92a7c42ec13  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
      - name: Reproduce bootstrap assets
        run: python tools/generate_bootstrap.py --check
      - name: Independent bootstrap regeneration
        run: python tools/check_bootstrap_reproduction.py
      - name: Round layout geometry
        run: |
          python tools/round_layout.py --write
          python tools/round_layout.py --check
          python tools/generate_basic_face.py --write
          python tools/generate_basic_face.py --check
          python tools/signature_preview.py --write
          python tools/signature_preview.py --check
          python tools/check_layout_reproduction.py
      - name: Check project invariants
        run: python tools/check_foundation.py
      - name: M01 synthetic motion evidence
        run: python tools/motion_storyboard.py --check
      - name: Validation tool regression tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Install Android SDK
        uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Confirm Android SDK tools
        run: |
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          java -version
          cat "$ANDROID_HOME/platforms/android-37.0/source.properties"
          ./gradlew --version
      - name: Official WFF validation
        run: python tools/verify_wff.py
      - name: Build debug APKs
        run: python tools/build_profiles.py assemble
      - name: Check APK contents
        run: python tools/check_apk.py
      - name: Official asset memory evaluation
        run: python tools/verify_memory.py
      - name: Verify debug APK signatures
        run: python tools/build_profiles.py signatures
      - name: Isolated generated flavor regression
        run: python tools/check_flavor_isolation.py
      - name: Isolated Signature basic display
        run: |
          python tools/check_basic_face_build.py --development-bundle "$RUNNER_TEMP/aura-signature-development.zip"
          test -s "$RUNNER_TEMP/aura-signature-development.zip"
      - name: Isolated Signature basic display without bundle
        run: python tools/check_basic_face_build.py
      - name: Upload layout development evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aura-layout-development-evidence
          path: assets/generated/layouts/
          if-no-files-found: error
      - name: Upload debug APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aura-bootstrap-debug-apks
          path: apps/watchface/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
      - name: Isolated Signature material APKs
        run: python tools/check_signature_material_build.py --output "$RUNNER_TEMP/aura-signature-material"
      - name: Upload Signature material development evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aura-signature-material-development
          path: ${{ runner.temp }}/aura-signature-material/
          if-no-files-found: error
