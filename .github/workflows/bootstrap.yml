name: AURA Bootstrap
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aura-bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Gradle wrapper
        run: echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
      - name: Check project invariants
        run: python tools/check_foundation.py
      - name: Validation tool regression tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Install Android SDK
        uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Confirm Android SDK tools
        run: sdkmanager --version
      - name: Official WFF validation
        run: python tools/verify_wff.py
      - name: Build debug APKs
        run: ./gradlew --no-daemon --stacktrace clean :apps:watchface:assembleWff2Debug :apps:watchface:assembleWff3Debug :apps:watchface:assembleWff4Debug
      - name: Check APK contents
        run: python tools/check_apk.py
      - name: Official asset memory evaluation
        run: python tools/verify_memory.py
      - name: Verify debug APK signatures
        run: |
          for apk in apps/watchface/build/outputs/apk/*/debug/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          done
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: aura-bootstrap-debug-apks
          path: apps/watchface/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
