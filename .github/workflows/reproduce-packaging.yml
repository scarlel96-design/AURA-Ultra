name: Historical WFF packaging reproduction
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reproduce-packaging.yml'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 95e51cca23210f930dc3716cb790e791585a7bf0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Confirm checkout credentials are not persisted
        shell: bash
        run: |
          rc=0
          git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1 || rc=$?
          test "$rc" -eq 1
      - name: Verify historical source
        run: |
          test "$(git rev-parse HEAD)" = 95e51cca23210f930dc3716cb790e791585a7bf0
          echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
      - uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Rebuild historical WFF2
        run: ./gradlew --no-daemon --stacktrace clean :apps:watchface:assembleWff2Debug
      - name: Inspect historical APK (expected prohibited payload)
        run: |
          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path
          apks = list(Path("apps/watchface/build/outputs/apk/wff2/debug").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit("Expected one historical APK")
          apk = apks[0]
          print("HISTORICAL_APK_SHA256", hashlib.sha256(apk.read_bytes()).hexdigest())
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              print("\n".join(sorted(names)))
              bad = [n for n in names if n.endswith((".dex", ".so")) or n.startswith("lib/")]
              print("HISTORICAL_PROHIBITED_ENTRIES", repr(bad))
              if not bad:
                  raise SystemExit("Historical failure not reproduced")
          PY
          apkanalyzer dex packages --defined-only apps/watchface/build/outputs/apk/wff2/debug/watchface-wff2-debug.apk
