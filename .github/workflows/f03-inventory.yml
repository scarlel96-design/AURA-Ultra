name: F03 provisional Gradle inventory
on:
  push:
    branches: [audit-f03-r03-gradle-inventory]
    paths:
      - '.github/workflows/f03-inventory.yml'
      - 'tools/audit_gradle_inventory.py'
      - 'tools/gradle_inventory.init.gradle'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build: [android, domain]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Confirm checkout credentials are not persisted
        shell: bash
        run: |
          rc=0
          git config --local --name-only --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1 || rc=$?
          test "$rc" -eq 1
      - name: Verify Gradle wrapper
        run: echo 'b3a875ddc1f044746e1b1a55f645584505f4a10438c1afea9f15e92a7c42ec13  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
      - name: Install Android SDK
        if: matrix.build == 'android'
        uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Collect untrusted dependency evidence
        run: python tools/audit_gradle_inventory.py --build "${{ matrix.build }}" --output "$RUNNER_TEMP/f03-inventory-${{ matrix.build }}"
      - name: Upload provisional inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f03-unreviewed-${{ matrix.build }}
          path: ${{ runner.temp }}/f03-inventory-${{ matrix.build }}/
          if-no-files-found: error
