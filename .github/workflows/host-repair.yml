name: Host repair diagnostic
on:
  push:
    branches: [fix/host-repro-closeout]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Set checkout line endings
        run: git config --global core.autocrlf true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Record exact environment and checkout
        run: |
          python --version
          python -c "import zlib; print(zlib.ZLIB_VERSION, zlib.ZLIB_RUNTIME_VERSION)"
          git check-attr eol -- assets/generated/bootstrap/palette.svg
          python tools/generate_bootstrap.py --check
      - name: Exercise CRLF repair and publication gate
        run: python -m unittest discover -s tests/unit -p test_host_repro_repair.py -v
      - name: Check actual material baseline
        run: python tools/check_material_baseline.py
