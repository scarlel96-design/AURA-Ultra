name: Intelligence RV02
on:
  push:
    branches:
      - main
      - agent/grok/GB-02-RV02
    paths:
      - 'modules/intelligence/**'
      - 'modules/domain/**'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'tools/check_domain_results.py'
      - 'tools/check_intelligence_results.py'
      - 'tools/intelligence_test_inventory.json'
      - 'tools/prepare_rv02_composite.py'
      - 'tests/unit/test_rv02_ci.py'
      - 'tests/unit/test_f03_r01.py'
      - '.github/workflows/intelligence-rv02.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'modules/intelligence/**'
      - 'modules/domain/**'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'tools/check_domain_results.py'
      - 'tools/check_intelligence_results.py'
      - 'tools/intelligence_test_inventory.json'
      - 'tools/prepare_rv02_composite.py'
      - 'tests/unit/test_rv02_ci.py'
      - 'tests/unit/test_f03_r01.py'
      - '.github/workflows/intelligence-rv02.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: intelligence-rv02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: >-
      (github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agent/grok/GB-02-RV02')) ||
      (github.event_name == 'pull_request' && github.head_ref == 'agent/grok/GB-02-RV02' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Confirm checkout credentials are not persisted
        shell: bash
        run: |
          rc=0
          git config --local --name-only --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1 || rc=$?
          test "$rc" -eq 1
      - name: Verify evidence and composite tools
        run: python -m unittest discover -s tests/unit -p test_rv02_ci.py -v
      - name: Verify Gradle wrapper
        run: echo "b3a875ddc1f044746e1b1a55f645584505f4a10438c1afea9f15e92a7c42ec13  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Materialize pinned RV01 Domain and current Intelligence
        if: github.ref != 'refs/heads/main'
        run: python tools/prepare_rv02_composite.py --output "$RUNNER_TEMP/rv02-composite"
      - name: Clean pinned Domain tests
        if: github.ref != 'refs/heads/main'
        run: ./gradlew -p "$RUNNER_TEMP/rv02-composite/modules/domain" clean test --rerun-tasks --no-build-cache --no-daemon
      - name: Validate pinned Domain JUnit
        if: github.ref != 'refs/heads/main'
        run: python tools/check_domain_results.py "$RUNNER_TEMP/rv02-composite/modules/domain/build/test-results/test" --profile rv01
      - name: Clean composite Intelligence tests
        if: github.ref != 'refs/heads/main'
        run: ./gradlew -p "$RUNNER_TEMP/rv02-composite/modules/intelligence" clean test --rerun-tasks --no-build-cache --no-daemon
      - name: Validate exact Intelligence JUnit
        if: github.ref != 'refs/heads/main'
        env:
          RV02_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: python tools/check_intelligence_results.py "$RUNNER_TEMP/rv02-composite/modules/intelligence/build/test-results/test" --ci
      - name: Verify composite source blobs after tests
        if: github.ref != 'refs/heads/main'
        run: python tools/prepare_rv02_composite.py --output "$RUNNER_TEMP/rv02-composite" --verify-only
      - name: Upload composite JUnit XML
        if: always() && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rv02-composite-junit-xml
          path: |
            ${{ runner.temp }}/rv02-composite/modules/domain/build/test-results/test/*.xml
            ${{ runner.temp }}/rv02-composite/modules/intelligence/build/test-results/test/*.xml
          if-no-files-found: error
