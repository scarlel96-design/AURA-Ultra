name: Active documentation budget
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  doc-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify budget checker
        run: python -m unittest discover -s tests/unit -p 'test_doc_budget.py' -v
      - name: Enforce active document byte limits
        run: python tools/check_doc_budget.py
